# Edge proxy do WZ Connect — único ponto de entrada público.
# Resolução de tenant por subdomínio acontece no backend (Fase 1).

upstream wz_backend {
    server backend:3000;
}

upstream wz_frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # API REST + health do backend
    location /api/ {
        proxy_pass http://wz_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://wz_backend/health;
        proxy_set_header Host $host;
    }

    # SPA (frontend)
    location / {
        proxy_pass http://wz_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
